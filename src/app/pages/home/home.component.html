<div class="container my-4">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-5 g-5">
    @for (user of users(); track user._id) {
    <app-user-card [user]="user"></app-user-card>
    }
  </div>
</div>

<div class="d-flex justify-content-center align-items-center mt-4 pt-3 border-top gap-3 gap-md-4">
  <button class="btn btn-outline-secondary d-flex align-items-center gap-2" [disabled]="currentPage() <= 1"
    (click)="previousPage()">
    <i class="bi bi-chevron-left"></i>
    Página anterior
  </button>
  <span class="text-muted small fw-semibold">
    Página {{ currentPage() }}
  </span>
  <button class="btn btn-outline-secondary d-flex align-items-center gap-2" [disabled]="currentPage() >= totalPages"
    (click)="nextPage()">
    Página siguiente
    <i class="bi bi-chevron-right"></i>
  </button>
</div>
